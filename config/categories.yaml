# ============================================================
# 分類清單：每個分類用 Zazzle RSS 的關鍵字搜尋 (qs) + 熱門排序 抓前 N 頁
#   key       : 內部代號（不要改，資料庫用它當主鍵）
#   qs        : Zazzle 搜尋關鍵字（等同網站上 /c/ 分類頁或搜尋結果）
#   dept      : 所屬大類（對應佣金表的 department）
#   board     : Pinterest 看板名稱（沒填就用 default_board）
#   tags      : 貼文 hashtag
#   season    : 選填，[開始月/日, 結束月/日]；季節內權重 ×3，季節外權重 ×0.3
#   weight    : 基礎權重（預設 1），越高越常被排入
# 自訂：直接增刪條目即可，程式下一次 harvest 自動套用
# ============================================================

