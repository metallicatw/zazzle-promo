[project]
name = "zpromo"
version = "1.0.0"
description = "Zazzle Ambassador product promotion scheduler (Pinterest, Tumblr, Bluesky, Threads, GitHub Pages)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6.0", "Pillow>=10.1", "requests-oauthlib>=1.3", "PyNaCl>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
